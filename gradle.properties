# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
# minecraft_version/yarn_mappings/loader_version/fabric_version confirmed working together
# (java/aurorasdeco-registry-spike, java/CLAUDE.md §3c) -- a real Fabric 1.21.1 mod built and loaded
# via Connector against the actual target modpack with these exact pins.
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.9

# Mod Properties
# 1.20.1/Fabric -> 1.21.1/Fabric upgrade, still targeting Sinytra Connector (java/CLAUDE.md §3b/§3c).
mod_version=1.2+1.21.1-fabric
maven_group=dev.lambdaurora
archives_base_name=aurorasdecorations

# Dependencies
fabric_version=0.102.1+1.21.1
# emi_version/trinkets_version are still the 1.20.1 version strings. EMI's own hook classes are
# excluded from compilation entirely (see disabled-emi-1.20.1/) so emi_version is inert for now.
# trinkets_version is compile-time-only for our TrinketsHooks entrypoint; the real target modpack
# loads its own Trinkets jar via Connector regardless (java/CLAUDE.md), and this hasn't caused a
# crash across 6+ live tests -- left alone. Real Maven metadata (maven.terraformersmc.com,
# dev.emi:trinkets) confirms no 1.21.1-targeted Trinkets release exists yet as of its latest
# version 3.10.0 (fabric-api 0.100.0+1.21, dated before 1.21.1 shipped) -- nothing better to pin to.
emi_version=1.0.18+1.20.1
trinkets_version=3.7.1
# Confirmed via maven.terraformersmc.com Gradle module metadata: terraform-wood-api-v1's own
# fabric-api submodule pins at 11.0.0 (fabric-content-registries-v0 8.0.14, fabric-object-builder-api-v1
# 15.1.12, fabric-networking-api-v1 4.2.0) sit right against our confirmed 1.21.1 fabric-api bundle's
# pins (8.0.16 / 15.2.0 / 4.2.2) -- v10.0.0's pins are a clear generation behind (targets plain 1.21)
# and v12.0.0's are a clear generation ahead (targets 1.21.2+), so 11.0.0 is the 1.21.1 release.
terraform_wood_api_version=11.0.0
