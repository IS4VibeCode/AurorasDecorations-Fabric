# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
# minecraft_version/yarn_mappings/loader_version/fabric_version confirmed working together
# (java/aurorasdeco-registry-spike, java/CLAUDE.md §3c) -- a real Fabric 1.21.1 mod built and loaded
# via Connector against the actual target modpack with these exact pins.
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.9

# Mod Properties
# 1.20.1/Fabric -> 1.21.1/Fabric upgrade, still targeting Sinytra Connector (java/CLAUDE.md §3b/§3c).
mod_version=1.2+1.21.1-fabric
maven_group=dev.lambdaurora
archives_base_name=aurorasdecorations

# Dependencies
fabric_version=0.102.1+1.21.1
# NOT YET CONFIRMED for 1.21.1 -- these three are still the 1.20.1 version strings and will almost
# certainly fail dependency resolution on the first build. Real 1.21.1-compatible versions needed
# from Modrinth/Maven (no network access in the sandbox to look these up) before this will resolve.
emi_version=1.0.18+1.20.1
trinkets_version=3.7.1
terraform_wood_api_version=7.0.1
