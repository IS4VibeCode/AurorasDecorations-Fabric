plugins {
	id 'fabric-loom' version '1.8-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'Ladysnake Libs'
		url = 'https://maven.ladysnake.org/releases'
	}
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/'
		content {
			includeGroup 'dev.emi'
			includeGroup 'com.llamalad7.mixinextras'
			includeGroup 'com.terraformersmc'
			includeGroup 'com.terraformersmc.terraform-api'
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Optional integrations -- both enabled in the original Quilt build (hasEmi/hasTrinkets = true).
	modImplementation "dev.emi:emi-fabric:${project.emi_version}"
	modImplementation "dev.emi:trinkets:${project.trinkets_version}"

	include(modImplementation("com.terraformersmc.terraform-api:terraform-wood-api-v1:${project.terraform_wood_api_version}") {
		exclude group: 'net.fabricmc'
		exclude group: 'net.fabricmc.fabric-api'
		exclude group: 'org.terraformersmc'
	})
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.deprecation(true)
	it.options.release = 21
	// javac's defaults (-Xmaxerrs 100 / -Xmaxwarns 100) were silently truncating build.log during the
	// 1.21.1 upgrade -- raised well past any expected single-round count so every error/warning is
	// visible in one pass instead of trickling out a hidden 100 at a time.
	it.options.compilerArgs << '-Xmaxerrs' << '10000' << '-Xmaxwarns' << '10000'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from('LICENSE') {
		rename { "${it}_${base.archivesName.get()}" }
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
